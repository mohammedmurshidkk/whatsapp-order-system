<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 { color: #333; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #45a049; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow-x: auto;
    }
    .template-links {
      margin: 20px 0;
      padding: 15px;
      background: #e7f3ff;
      border-radius: 4px;
    }
    .template-links a {
      color: #0066cc;
      margin-right: 20px;
    }
  </style>
</head>
<body>
  <h1>📋 Menu CSV Upload</h1>

  <div class="template-links">
    <strong>Download Templates:</strong><br><br>
    <a href="/api/menu/template" download>📄 Blank Template</a>
    <a href="/api/menu/template/sample" download>📄 Sample Template</a>
  </div>

  <form id="uploadForm">
    <div class="form-group">
      <label for="businessId">Business ID:</label>
      <input type="text" id="businessId" name="businessId"
             value="c3150207-4bf9-4ce4-8478-2e6369c46749" required>
    </div>

    <div class="form-group">
      <label for="csvFile">Select CSV File:</label>
      <input type="file" id="csvFile" name="menu" accept=".csv" required>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="replace" name="replace">
      <label for="replace" style="margin-bottom: 0;">Replace existing menu (delete all current items)</label>
    </div>

    <button type="submit">Upload Menu</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const businessId = document.getElementById('businessId').value;
      const fileInput = document.getElementById('csvFile');
      const replace = document.getElementById('replace').checked;
      const resultDiv = document.getElementById('result');

      if (!fileInput.files[0]) {
        resultDiv.className = 'error';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Please select a CSV file';
        return;
      }

      // Read file content
      const file = fileInput.files[0];
      const csvContent = await file.text();

      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.innerHTML = 'Uploading...';

      try {
        const response = await fetch(`/api/menu/${businessId}/import`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            csv: csvContent,
            replace: replace
          })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `
            <strong>✅ ${data.message}</strong><br><br>
            Categories created: ${data.categoriesCreated}<br>
            Items created: ${data.itemsCreated}<br>
            Items updated: ${data.itemsUpdated}<br>
            ${data.errors && data.errors.length > 0 ? '<br>Errors:<br>' + data.errors.join('<br>') : ''}
          `;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `
            <strong>❌ Error:</strong> ${data.error}<br>
            ${data.details ? '<pre>' + JSON.stringify(data.details, null, 2) + '</pre>' : ''}
          `;
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
      }
    });
  </script>
</body>
</html>
